server:
  port: 8065

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 存储 DataAgent 业务数据的数据库，并非Agent分析数据的来源
spring:
  config:
    # 从仓库根目录或模块父目录加载本地配置；文件不存在时仍允许通过系统环境变量启动。
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  codec:
    # Python workflow timelines can contain generated code, result data and the final report.
    max-in-memory-size: 10MB
  datasource:
    # 必填项不提供默认值，避免缺少配置时误连数据库或使用弱密码。
    url: ${DATA_AGENT_DATASOURCE_URL}
    username: ${DATA_AGENT_DATASOURCE_USERNAME}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
      separator: ;
      encoding: utf-8
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      type: chroma
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
          username: ${CHROMA_USERNAME:}
          password: ${CHROMA_PASSWORD:}
        tenant-name: ${CHROMA_TENANT:SpringAiTenant}
        database-name: ${CHROMA_DATABASE:SpringAiDatabase}
        collection-name: ${CHROMA_COLLECTION:data_agent}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:true}
    alibaba:
      data-agent:
        vector-store:
          table-topk-limit: 10
          table-similarity-threshold: 0.2
          default-topk-limit: 8
          default-similarity-threshold: 0.4
          embedding-dimension: ${CHROMA_DIMENSION:0}
          enable-hybrid-search: ${HYBRID_SEARCH_ENABLED:true}
          hybrid-search-timeout-ms: ${HYBRID_SEARCH_TIMEOUT_MS:3000}
          vector-candidate-top-k: ${HYBRID_VECTOR_CANDIDATE_TOP_K:30}
          keyword-candidate-top-k: ${HYBRID_KEYWORD_CANDIDATE_TOP_K:30}
          rrf-k: ${HYBRID_RRF_K:60}
          dense-weight: ${HYBRID_DENSE_WEIGHT:0.7}
          keyword-weight: ${HYBRID_KEYWORD_WEIGHT:0.3}
          rerank-top-n: ${RERANK_TOP_N:8}
          keyword-index-path: ${KEYWORD_INDEX_PATH:./vectorstore/lucene}
          keyword-index-rebuild-on-start: ${KEYWORD_INDEX_REBUILD_ON_START:true}
        code-executor:
          python-max-tries-count: 5
          code-timeout: 60s
          limit-memory: 500
          cpu-core: 1
          sandbox:
            docker-host: ${DATAAGENT_SANDBOX_DOCKER_HOST:unix:///var/run/docker.sock}
            image-name: ${DATAAGENT_SANDBOX_IMAGE:agentscope-registry.ap-southeast-1.cr.aliyuncs.com/agentscope/runtime-sandbox-base:latest}
            max-concurrency: 4
            queue-capacity: 10
            max-connections: 4096
            package-index-url: ${DATAAGENT_PYPI_INDEX_URL:https://pypi.org/simple}
            dependency-install-timeout: 3m
        file:
          type: local
          path-prefix: data-agent
          # 当前目录下不要用点， ./uploads win下拼接完整格式路径会解析不了，比如 data-agent/./uploads win识别不了
          path: uploads
          url-prefix: /uploads
          imageSize: 2097152
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        max-sql-retry-count: 10
        # Langfuse 可观测性配置
        langfuse:
          enabled: ${LANGFUSE_ENABLED:false}
          host: ${LANGFUSE_HOST:}
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          secret-key: ${LANGFUSE_SECRET_KEY:}
  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

mybatis:

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: info
    com.alibaba.cloud.ai.dataagent.workflow.node: info
    com.alibaba.cloud.ai.mapper: info
    org.springframework.jdbc: info
