services:
  # 默认向量数据库
  chroma:
    image: chromadb/chroma
    container_name: data-agent-chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    ports:
      # 宿主机端口与本地运行的 Backend 共用 CHROMA_PORT；容器内端口固定为 8000。
      - "${CHROMA_PORT:-9000}:8000"
    volumes:
      - chroma-data:/data
    networks:
      - app-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-backend
      tags:
        - saa-data-agent-backend:1.0.0-SNAPSHOT
    container_name: data-agent-backend
    env_file:
      - ../.env
    environment:
      # 容器内通过服务名访问 Chroma；其余配置统一从仓库根目录 .env 注入。
      - CHROMA_HOST=${CHROMA_DOCKER_HOST:-http://chroma}
      - CHROMA_PORT=8000
      # 容器网络继续使用固定的 8065；宿主机发布端口单独配置。
      - SERVER_PORT=8065
      - KEYWORD_INDEX_PATH=/app/vectorstore/lucene
    ports:
      - "${SERVER_HOST_PORT:-9065}:8065"
    depends_on:
      chroma:
        condition: service_started
      mysql-data:
        condition: service_healthy
      postgres-data:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - lucene-index:/app/vectorstore/lucene
    restart: unless-stopped

  # Vue前端服务
  frontend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-frontend
      tags:
        - saa-data-agent-frontend:1.0.0-SNAPSHOT
    container_name: data-agent-frontend
    ports:
      - "3000:3000"  # 只暴露前端端口
    depends_on:
      - backend
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    restart: unless-stopped

  # MySQL 模拟数据源
  mysql-data:
    image: mysql:8.0
    container_name: data-agent-mysql-datasource
    restart: always
    env_file:
      - ../.env
    networks:
      - app-network
    volumes:
      - ./config/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 模拟数据源
  postgres-data:
    image: postgres:15
    container_name: data-agent-postgres-datasource
    restart: always
    env_file:
      - ../.env
    networks:
      - app-network
    volumes:
      - ./config/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"

volumes:
  chroma-data:
  lucene-index:
