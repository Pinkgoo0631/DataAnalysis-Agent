#
# 自托管部署流水线（fork 专用）：
# 推送到 main 后，在注册于本服务器的自托管 runner 上重新构建并启动容器栈。
# 不用 actions/checkout：仓库为 public，直接 git clone 更省（避免 codeload 慢）；
# runner 容器以 host 网络运行，故 127.0.0.1:3000/8065 即宿主上的应用端口。
# 注意：data_agent 业务库在外部 mysql0631 容器中，compose 内已设 SQL_INIT=never，
#       本流水线只做 build + up，绝不初始化/删改业务库。
name: Deploy to Server

on:
  push:
    branches:
      - main
    # 仅当部署相关路径变更时才自动发布；纯文档/CI/图片改动不触发重建。
    paths:
      - 'data-agent-management/**'
      - 'data-agent-frontend-nuxt/**'
      - 'docker-file/**'
      - '.github/workflows/deploy.yml'
      - 'pom.xml'
      - 'mvnw'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Rebuild and restart stack
    runs-on: [self-hosted, linux, x64, dataagent-server]
    timeout-minutes: 90
    steps:
      - name: Clone latest main (shallow)
        run: |
          SRC="$RUNNER_TEMP/data-agent-src"
          rm -rf "$SRC"
          git clone --depth 1 --branch main \
            https://github.com/Pinkgoo0631/DataAnalysis-Agent.git "$SRC"
          git -C "$SRC" log -1 --format='deploying %h (%s)'

      - name: Ensure app network and attach mysql0631
        run: |
          docker network inspect data-agent-network >/dev/null 2>&1 \
            || docker network create data-agent-network
          docker network connect data-agent-network mysql0631 2>/dev/null || true

      - name: Build and restart backend + frontend
        env:
          AI_DASHSCOPE_API_KEY: ${{ secrets.AI_DASHSCOPE_API_KEY }}
        run: |
          SRC="$RUNNER_TEMP/data-agent-src"
          docker compose -f "$SRC/docker-file/docker-compose.yml" \
            up -d --build --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf --max-time 5 http://127.0.0.1:8065/v3/api-docs >/dev/null 2>&1; then
              echo "backend OK after $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy"
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          exit 1

      - name: Smoke test frontend
        run: |
          html=$(curl -sf --max-time 5 http://127.0.0.1:3000/ || true)
          if echo "$html" | grep -q "_nuxt"; then
            echo "frontend OK: serves Nuxt app"
          else
            echo "frontend did not serve Nuxt (check index.html / nginx)"
            echo "$html" | head -20
            exit 1
          fi
